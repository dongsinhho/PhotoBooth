name: Hardware compatibility report
description: Report a camera, PC, OS or output combination with reproducible details.
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Report only hardware/software details and redacted text logs. Do not attach guest photos, webcam frames, rendered strips, credentials, payment screenshots, device serials or unredacted personal paths.
  - type: input
    id: app_version
    attributes:
      label: PhotoBooth version or commit
      placeholder: Commit hash, tag, or local build date
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and exact version/build
      placeholder: Windows 11 Pro 64-bit, build 26200
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC / CPU / architecture
      placeholder: Ryzen 5 8600G, x64
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera make and exact model
      placeholder: Logitech B525 HD Webcam
    validations:
      required: true
  - type: input
    id: connection
    attributes:
      label: Camera connection / hub / cable details
      placeholder: Direct USB 2.0 port, no hub
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Provider / backend / SDK or driver version
      placeholder: Go windowsmf / Windows Media Foundation
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Requested resolution and FPS
      placeholder: 1280x720 at 30 FPS
    validations:
      required: true
  - type: dropdown
    id: test
    attributes:
      label: What did you test?
      options:
        - Device detection only
        - Stream open / frame read
        - Capture JPEG
        - Capture → render → local output
        - Recovery after camera contention
        - USB disconnect / reconnect during capture
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Fail
        - Partial
    validations:
      required: true
  - type: dropdown
    id: synthetic
    attributes:
      label: Does the synthetic-camera workflow succeed on this machine?
      options:
        - Yes
        - No
        - Not tested
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Exact steps / command
      description: Include the exact command with personal paths and device identifiers removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result and error (redacted)
      description: Include stable error codes/HRESULTs where available. Do not include photos.
      render: text
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: Limitations / notes
      description: Lighting, camera distance, printer model, driver state, repeat count, etc.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached guest photos, webcam frames, rendered images, credentials, payment details, tokens, serial numbers or unredacted personal paths.
          required: true
